# Alembic configuration.
#
# NOTE: keep this file ASCII-only. Alembic reads it with the OS *locale* encoding
# (GBK on a Chinese Windows), and non-ASCII bytes raise UnicodeDecodeError there.
# Chinese explanations live in alembic/env.py instead.
#
# The database URL is NOT set here: alembic/env.py reads it from the app Settings
# (backend/.env), so migrations always target the same database as the app.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
